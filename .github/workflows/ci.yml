name: Build and validate NeoZygisk PostBoot

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated module ZIP to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: neozygisk-postboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        run: |
          rustup override set nightly
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zygiskd -> build/rust/target

      - name: Confirm native implementation matches the validated source generation
        run: |
          set -euo pipefail
          KNOWN_GOOD_NATIVE_BASELINE=c99afe55c263085332071d81e0daaba048d44663
          git cat-file -e "${KNOWN_GOOD_NATIVE_BASELINE}^{commit}"

          git diff --name-only "$KNOWN_GOOD_NATIVE_BASELINE" "$GITHUB_SHA" > changed-from-baseline.txt
          grep -Ev '^($|\.github/release-status/.*|\.github/workflows/(ci\.yml|record-approved-release\.yml)|README\.md|build\.gradle\.kts|docs/.*|module/build\.gradle\.kts|module/src/(action\.sh|customize\.sh|module\.prop|post-fs-data\.sh|postboot-activate\.sh|postboot-bootstrap\.sh|service\.sh|uninstall\.sh))$' \
            changed-from-baseline.txt > unexpected-native-drift.txt || true

          if [ -s unexpected-native-drift.txt ]; then
            echo "Files outside the validated shell/build/documentation surface changed since the native-source baseline:" >&2
            cat unexpected-native-drift.txt >&2
            exit 1
          fi

      - name: Build release module ZIP
        run: |
          chmod +x gradlew
          ./gradlew zipRelease \
            -Porg.gradle.parallel=true \
            -Porg.gradle.vfs.watch=true \
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Verify fail-closed update lifecycle
        run: |
          set -eu
          BUILT_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-release.zip' | head -n 1)
          test -n "$BUILT_ZIP"
          rm -rf release-check
          mkdir release-check
          unzip -q "$BUILT_ZIP" -d release-check

          for script in release-check/*.sh; do
            sh -n "$script"
          done

          grep -F 'WORK=/dev/.neozygisk' release-check/postboot-bootstrap.sh
          grep -F 'UPDATE_REQUIRES_FULL_REBOOT' release-check/postboot-bootstrap.sh
          grep -F 'ZYGOTE_CRASH_REQUIRES_FULL_REBOOT' release-check/postboot-bootstrap.sh
          grep -F 'MONITOR_EXE_DELETED=' release-check/postboot-bootstrap.sh
          grep -F 'MONITOR_BINARY_MATCH=' release-check/postboot-bootstrap.sh
          grep -F 'RUNTIME_LIBRARY_MATCH=' release-check/postboot-bootstrap.sh
          grep -F '[ "$MONITOR_EXE_DELETED" -eq 0 ] || return 1' release-check/postboot-bootstrap.sh
          grep -F '[ "$MONITOR_BINARY_MATCH" -eq 1 ] || return 1' release-check/postboot-bootstrap.sh
          grep -F '[ "$RUNTIME_LIBRARY_MATCH" -eq 1 ] || return 1' release-check/postboot-bootstrap.sh
          grep -F 'update_requires_full_reboot' release-check/customize.sh
          grep -F 'FULL_REBOOT_REQUIRED=' release-check/postboot-activate.sh
          grep -F 'status) status_live' release-check/postboot-activate.sh
          grep -F 'if [ "$ARCH" != "arm64" ]' release-check/customize.sh
          grep -F 'version=v2.3-postboot.3.2' release-check/module.prop
          grep -F 'id=zygisksu' release-check/module.prop

          VERSION_CODE=$(sed -n 's/^versionCode=//p' release-check/module.prop | head -n 1)
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "Invalid module versionCode: $VERSION_CODE" >&2; exit 1 ;;
          esac
          if [ "$VERSION_CODE" -le 347 ]; then
            echo "Stable versionCode must be newer than the installed recovery build 347" >&2
            exit 1
          fi

          if grep -R -a -E 'ctl[[:space:]]+start|ksud[[:space:]]+soft-reboot|ctl\.restart|setprop[[:space:]]+ctl\.restart|/system/bin/reboot|svc[[:space:]]+power[[:space:]]+reboot|SIGKILL|kill[[:space:]]+-9|ctl\.stop|setprop[[:space:]]+ctl\.stop' release-check/*.sh; then
            echo 'A packaged script can restart, resume, kill, or perform destructive recovery.' >&2
            exit 1
          fi

          for binary in release-check/lib/*/libzygisk_ptrace.so; do
            strings "$binary" | grep -F '/dev/.neozygisk'
          done

          RELEASE_FILE=$(basename "$BUILT_ZIP")
          RELEASE_STEM=${RELEASE_FILE%.zip}
          RELEASE_TAG=${RELEASE_STEM#NeoZygisk-}
          cp "$BUILT_ZIP" "$RELEASE_FILE"
          sha256sum "$RELEASE_FILE" | tee "${RELEASE_FILE}.sha256"
          unzip -t "$RELEASE_FILE"
          sha256sum -c "${RELEASE_FILE}.sha256"

          echo "RELEASE_ZIP=$RELEASE_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Publish approved raw module ZIP to GitHub Releases
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release neozygisk]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > release-notes.md <<EOF
          Hardware-validated NeoZygisk PostBoot 3.2 release for temporary KernelSU sessions on the Samsung Galaxy S25 Ultra SM-S938B / S938BXXSBCZG3.

          Validated recovery lifecycle:
          1. full device reboot;
          2. simple Root My Galaxy exploit;
          3. one user-initiated Soft Reboot from KernelSU Manager;
          4. live same-generation verification.

          The successful hardware result reported INJECTION_VERIFIED, a single monitor attached to init, matching live/installed native generations, injected zygote64, running zygiskd64, working Zygisk Assistant and LSPosed, and no module-initiated restart.

          Provider updates must never be activated by Soft Reboot while an older monitor remains alive in the same kernel boot. Install the update, perform a full device reboot, rerun the simple exploit, then use KernelSU Manager Soft Reboot once.

          The module contains no KernelSU Soft Reboot command, targeted zygote restart, device reboot, process kill or in-session recovery path.

          Source commit: ${GITHUB_SHA}
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" "${RELEASE_ZIP}.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_FILE" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" "${RELEASE_ZIP}.sha256" \
              --target "$GITHUB_SHA" --title "$RELEASE_FILE" --notes-file release-notes.md --latest
          fi
