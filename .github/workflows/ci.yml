name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        run: |
          rustup override set nightly
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Ccache for faster builds
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zygiskd -> build/rust/target

      - name: Build with Gradle
        run: ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Verify PostBoot Phase 2 module
        run: |
          set -eu
          RELEASE_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-release.zip' | head -n 1)
          test -n "$RELEASE_ZIP"
          rm -rf phase2-check
          mkdir phase2-check
          unzip -q "$RELEASE_ZIP" -d phase2-check

          test -f phase2-check/postboot-bootstrap.sh
          grep -F 'WORK=/debug_ramdisk/neozygisk' phase2-check/postboot-bootstrap.sh
          grep -F 'postboot-bootstrap.sh" ensure' phase2-check/post-fs-data.sh
          grep -F 'postboot-bootstrap.sh" ensure' phase2-check/service.sh
          grep -F "extract \"\$ZIPFILE\" 'postboot-bootstrap.sh'" phase2-check/customize.sh
          grep -F 'id=zygisksu' phase2-check/module.prop

          for script in phase2-check/*.sh; do
            sh -n "$script"
          done

          for binary in phase2-check/lib/*/libzygisk_ptrace.so; do
            strings "$binary" | grep -F '/debug_ramdisk/neozygisk'
          done

          if grep -R -a -F '/data/adb/neozygisk' phase2-check; then
            echo 'Legacy /data/adb/neozygisk runtime path remains in the built module.' >&2
            exit 1
          fi

          if grep -R -a -E 'ksud[[:space:]]+soft-reboot|ctl\.restart|setprop[[:space:]]+ctl\.restart' phase2-check; then
            echo 'A forbidden userspace or zygote restart command is present in Phase 2.' >&2
            exit 1
          fi

      - name: Prepare build artifacts
        if: success()
        id: prepare_artifacts
        run: |
          RELEASE_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-release.zip' | head -n 1)
          DEBUG_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-debug.zip' | head -n 1)

          RELEASE_NAME=$(basename "$RELEASE_ZIP" .zip)
          DEBUG_NAME=$(basename "$DEBUG_ZIP" .zip)

          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "DEBUG_NAME=${DEBUG_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_OUTPUT"
          echo "DEBUG_ZIP=${DEBUG_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.RELEASE_NAME }}
          path: ${{ steps.prepare_artifacts.outputs.RELEASE_ZIP }}

      - name: Upload Debug Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.DEBUG_NAME }}
          path: ${{ steps.prepare_artifacts.outputs.DEBUG_ZIP }}

      - name: Upload Release Symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols
          path: zygiskd/build/symbols/release/

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: zygiskd/build/symbols/debug/
