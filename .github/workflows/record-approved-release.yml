name: Record approved NeoZygisk release

on:
  workflow_run:
    workflows: ["Build and validate NeoZygisk PostBoot"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: contains(github.event.workflow_run.head_commit.message, '[release neozygisk]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Record approved release result
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          cat > .github/release-status/neozygisk-approved-release.txt <<EOF
          conclusion=${{ github.event.workflow_run.conclusion }}
          run_id=${{ github.event.workflow_run.id }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          event=${{ github.event.workflow_run.event }}
          url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status/neozygisk-approved-release.txt
          git commit -m "Record approved NeoZygisk release result [skip ci]" || exit 0
          git push origin HEAD:master
